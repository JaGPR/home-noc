# /etc/systemd/system/nebula-sync.service.d/wait-for-pihole.conf
# At boot nebula-sync can start before Pi-hole's API listens ("connection refused").
# Wait up to 2 minutes for the local web UI. Change 8080 to your replica's web port.
[Service]
ExecStartPre=/bin/sh -c "for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8080/admin/ && exit 0; sleep 2; done; exit 1"
