<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOC sign in</title>
<style>
  :root { color-scheme: light dark; --bg:#f3f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --border:#e3e8f0; --accent:#2563eb; --accent-bg:#e9f0ff; --bad:#dc2626; --bad-bg:#fdecec; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0a0e16; --card:#111827; --text:#e6ebf5; --muted:#8b97ac; --border:#1e2838; --accent:#5b8dff; --accent-bg:#152447; --bad:#ff6b6b; --bad-bg:#371719; } }
  :root[data-theme="dark"] { --bg:#0a0e16; --card:#111827; --text:#e6ebf5; --muted:#8b97ac; --border:#1e2838; --accent:#5b8dff; --accent-bg:#152447; --bad:#ff6b6b; --bad-bg:#371719; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    background:radial-gradient(900px 500px at 15% -10%, var(--accent-bg), transparent 60%), radial-gradient(700px 400px at 100% 110%, color-mix(in srgb, #7c3aed 14%, transparent), transparent 60%), var(--bg); }
  form { width:100%; max-width:360px; background:var(--card); border:1px solid var(--border); border-radius:18px; padding:30px; box-shadow:0 24px 60px rgba(0,0,0,.18); }
  .logo { width:44px; height:44px; border-radius:13px; display:grid; place-items:center; color:#fff; margin-bottom:16px;
    background:linear-gradient(135deg, var(--accent), #7c3aed); box-shadow:0 8px 20px rgba(37,99,235,.35); }
  .logo svg { width:24px; height:24px; }
  h1 { font-size:21px; font-weight:700; margin:0 0 4px; letter-spacing:-.02em; }
  p { color:var(--muted); margin:0 0 18px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 5px; font-weight:500; }
  input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:10px; background:var(--bg); color:var(--text); font:inherit; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
  button { width:100%; margin-top:22px; padding:11px; border:0; border-radius:10px; background:var(--accent); color:#fff; font:inherit; font-weight:650; cursor:pointer; }
  button:hover { filter:brightness(.95); } button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .link { display:block; margin-top:14px; font-size:13px; color:var(--accent); text-align:center; text-decoration:none; }
  .link:hover { text-decoration:underline; }
  form[hidden], [hidden] { display:none !important; }
  .err { color:var(--bad); background:var(--bad-bg); border-radius:9px; padding:8px 11px; font-size:13px; margin-top:14px; display:none; }
</style>
<script>try { const t = localStorage.getItem('noc-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
<form method="post" action="/login">
  <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="2.4"/><circle cx="5" cy="19" r="2.4"/><circle cx="19" cy="19" r="2.4"/><path d="M12 7.4v4.1M12 11.5l-5.3 5.6M12 11.5l5.3 5.6"/></svg></div>
  <h1>NOC</h1>
  <p>Sign in to manage the network.</p>
  <label for="u">User</label><input id="u" name="user" autocomplete="username" required autofocus>
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="err" id="err">Wrong user or password.</div>
  <a href="#" class="link" id="forgot">Forgot password?</a>
</form>
<form id="reset" hidden>
  <h1>Reset password</h1>
  <p id="r-intro">A one-time code is sent to the NOC's Telegram chat.</p>
  <button type="button" id="r-send">Send code to Telegram</button>
  <div id="r-step2" hidden>
    <label for="r-code">Code from Telegram</label><input id="r-code" inputmode="numeric" autocomplete="one-time-code" placeholder="1234-5678">
    <label for="r-new">New password</label><input id="r-new" type="password" autocomplete="new-password" minlength="10">
    <label for="r-new2">New password again</label><input id="r-new2" type="password" autocomplete="new-password" minlength="10">
    <button type="submit">Set new password</button>
  </div>
  <div class="err" id="r-err"></div>
  <a href="#" class="link" id="back">Back to sign in</a>
</form>
<script>
const $ = s => document.querySelector(s), login = $('form[action="/login"]'), reset = $('#reset');
if (location.search.includes('bad=1')) $('#err').style.display = 'block';
const fail = msg => { $('#r-err').textContent = msg; $('#r-err').style.display = msg ? 'block' : 'none'; };
const post = async (url, body) => {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body || {})});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.statusText);
  return d;
};
$('#forgot').onclick = ev => { ev.preventDefault(); login.hidden = true; reset.hidden = false; fail(''); };
$('#back').onclick = ev => { ev.preventDefault(); reset.hidden = true; login.hidden = false; };
$('#r-send').onclick = async () => {
  fail('');
  try {
    const d = await post('/login/forgot');
    $('#r-intro').textContent = `Code sent to Telegram. It is valid for ${d.valid_min} minutes and works once.`;
    $('#r-send').textContent = 'Send a new code';
    $('#r-step2').hidden = false; $('#r-code').focus();
  } catch (e) { fail(e.message); }
};
reset.onsubmit = async ev => {
  ev.preventDefault(); fail('');
  if ($('#r-new').value !== $('#r-new2').value) return fail('The new passwords do not match.');
  try { await post('/login/reset', {code: $('#r-code').value, new: $('#r-new').value}); location.href = '/'; }
  catch (e) { fail(e.message); }
};
</script>
</body>
</html>
