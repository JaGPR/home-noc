<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOC sign in</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#16181d; --muted:#667085; --border:#e3e6ec; --accent:#2f6fde; --bad:#c2372f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#171a21; --text:#e7e9ee; --muted:#8b93a3; --border:#262b35; --accent:#5b8ff0; --bad:#ef6a62; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding:16px; }
  form { width:100%; max-width:340px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:28px; }
  h1 { font-size:20px; font-weight:600; margin:0 0 4px; }
  p { color:var(--muted); margin:0 0 20px; font-size:14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 4px; }
  input { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text); font:inherit; }
  button { width:100%; margin-top:20px; padding:10px; border:0; border-radius:8px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  .err { color:var(--bad); font-size:13px; margin-top:12px; display:none; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>NOC</h1>
  <p>Sign in to manage the network.</p>
  <label for="u">User</label><input id="u" name="user" autocomplete="username" required>
  <label for="p">Password</label><input id="p" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <div class="err" id="err">Wrong user or password.</div>
</form>
<script>if (location.search.includes('bad=1')) document.getElementById('err').style.display = 'block';</script>
</body>
</html>
