name: Release

# Pushing a tag vX.Y.Z publishes what install.sh downloads: home-noc.tar.gz and its checksum.
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the archive and its checksum
        run: |
          git archive --format=tar.gz --prefix=home-noc/ -o home-noc.tar.gz "$GITHUB_SHA"
          sha256sum home-noc.tar.gz > home-noc.tar.gz.sha256
      - name: The archive holds what the installer needs
        run: |
          tar tzf home-noc.tar.gz | grep -qx 'home-noc/deploy/install.sh'
          tar tzf home-noc.tar.gz | grep -qx 'home-noc/deploy/first-config.py'
          tar tzf home-noc.tar.gz | grep -qx 'home-noc/app/app.py'
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" home-noc.tar.gz home-noc.tar.gz.sha256 --generate-notes
